[project]
name = "mow-mcp"
version = "0.1.0"
description = "MCP server: cach agent code vao the gioi, test dien rong va bat bug chinh xac."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2",
  "pydantic>=2.9",
]

[project.scripts]
mow-mcp = "mow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mow_mcp"]
