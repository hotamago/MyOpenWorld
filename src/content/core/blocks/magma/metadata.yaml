# Magma: lỏng, nhưng **không** `walkable`.
#
# Hai trường này nói hai chuyện khác nhau, và đây là ô chứng minh điều đó.
# `liquid` là vật lý — nó chảy, nó lan. `walkable` là câu hỏi *"đường tìm được
# có được đi qua đây không"*, và câu trả lời là không, vì đi qua nghĩa là chết.
# Gộp hai trường lại sẽ làm một trong hai câu hỏi không hỏi được nữa.
