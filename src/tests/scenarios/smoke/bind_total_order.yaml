scenario: bind_total_order
description: >
  Bo chon phai co thu tu toan phan. Aren va Bram cung 40 tuoi; khong co ve
  `id asc` thi thu tu giua ho khong xac dinh va kich ban se chap chon.
  Bai nay chay nhieu lan phai luon chon dung cung mot nguoi.
worldseed: "test:tiny_village"
llm_mode: STUB

bind:
  "@village":
    kind: settlement
    select: first
    order: ["id asc"]
  "@elder":
    kind: entity
    in: "@village"
    tag: sapient
    select: first
    order: ["age desc", "id asc"]
  "@second_elder":
    kind: entity
    in: "@village"
    tag: sapient
    select: nth
    n: 2
    order: ["age desc", "id asc"]

given: []
when: []

then:
  - assert_attr: { entity: "@elder", key: "core.name", equals: "Aren" }
  - assert_attr: { entity: "@second_elder", key: "core.name", equals: "Bram" }
  - assert_attr: { entity: "@elder", key: "core.age", equals: 40 }
