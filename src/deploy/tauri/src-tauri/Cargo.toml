[package]
name = "mow-desktop"
description = "Ban desktop: WebView cong backend nhung, khong can may chu."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

# Ban desktop nam NGOAI workspace chinh, co y.
#
# `mow-desktop` keo vao ~400 crate cua Tauri va WebView. Neu no o trong
# workspace thi `cargo test --workspace` — lenh chay o moi PR — se build ca cay
# do, va vong lap phan hoi cua moi nguoi cham di vai phut cho mot thu ho khong
# dung toi. Bang chung "devtool khong lot vao ban phat hanh" van giu duoc, vi no
# duoc kiem o `crates/mow-devtool/tests/khong_co_trong_release.rs` bang cach doc
# manifest nay chu khong bang cach build no.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CHU Y: khong co `mow-devtool` o day, va khong bao gio duoc co.
# Cargo hop nhat feature, nen mot phu thuoc vo dieu kien se bat `devtool` o ca
# ban release. Xem `crates/mow-devtool/tests/khong_co_trong_release.rs`.
mow-core = { path = "../../../crates/mow-core" }
mow-config = { path = "../../../crates/mow-config" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
