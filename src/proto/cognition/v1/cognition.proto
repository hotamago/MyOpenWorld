// Hợp đồng của chu trình nhận thức (`idea.md §10.4`, `plan.md §P5`).
//
// ## Vì sao hợp đồng này trông "nghèo" một cách có chủ đích
//
// Nó không có trường nào cho model trả về code, không có trường nào cho model
// khẳng định một precondition đã thỏa, và không có trường nào cho model ghi
// thẳng một belief. Ba thứ đó lần lượt bị chặn bởi `§10.4` bước 5, bước 7 và
// `§20.11.3`, và cả ba đều là những thứ mà một hợp đồng "tiện dụng" sẽ có.
//
// Ranh giới thật sự nằm ở đây: **model đề nghị, engine quyết định.** Mọi trường
// đi ra từ Python là một *đề nghị*, và tên kiểu nói rõ điều đó.

syntax = "proto3";

package mow.cognition.v1;

import "common/v1/common.proto";

// Vì sao một thực thể được nghĩ ở lúc này (`§10.4` bước 1).
//
// Ghi lại có mục đích cụ thể: khi audit hỏi "vì sao cả vùng này hành xử ngờ
// nghệch hôm đó", câu trả lời thường nằm ở chỗ mọi người đều được đánh thức bởi
// cùng một loại trigger.
enum Trigger {
  TRIGGER_UNSPECIFIED = 0;
  // Kế hoạch thất bại.
  TRIGGER_PLAN_FAILED = 1;
  // Hai mục tiêu xung đột.
  TRIGGER_GOAL_CONFLICT = 2;
  // Sự kiện lớn xảy ra trong tầm tri giác.
  TRIGGER_MAJOR_EVENT = 3;
  // Đối thoại quan trọng.
  TRIGGER_DIALOGUE = 4;
  // Đến kỳ suy nghĩ định kỳ.
  TRIGGER_SCHEDULED = 5;
}

// Một quan sát mà engine đã kiểm là **hợp lệ theo giác quan** (`§10.4` bước 2).
//
// Nghĩa là: nếu thực thể không nhìn thấy, nó sẽ không có mặt ở đây. Việc lọc
// diễn ra ở phía Rust, trước khi dữ liệu chạm vào prompt — `§P6.2` quy tắc 3
// nói rõ rằng quét chuỗi lúc render không bao giờ bắt được rò rỉ ngữ nghĩa kiểu
// "kẻ phản bội mặc áo xanh".
message Observation {
  string id = 1;
  mow.common.v1.Tick at_tick = 2;
  // Danh tính chỉ có khi thực thể **nhận ra** đối tượng. Sương mù, cải trang và
  // khoảng cách đều làm trường này rỗng, và một quan sát không danh tính vẫn là
  // một quan sát có ích.
  optional mow.common.v1.EntityId subject = 3;
  string summary = 4;
  // Kênh tri giác đã bắt được nó: `sight`, `sound`, `smell`.
  string channel = 5;
}

// Một ký ức đã truy xuất (`§10.4` bước 3).
message RetrievedMemory {
  string id = 1;
  string content = 2;
  mow.common.v1.Tick at_tick = 3;
  // Điểm liên quan, thang `0`–`1000`. Số nguyên, không phải `float`, vì nó lọt
  // vào thứ tự sắp xếp và thứ tự sắp xếp lọt vào kết quả.
  uint32 relevance = 4;
}

// Toàn bộ ngữ cảnh mà một thực thể được phép biết khi nghĩ.
//
// Đây là **ranh giới ACL**. Mọi thứ ngoài message này, thực thể không biết. Một
// trường "và thêm ít bối cảnh cho hay" ở đây sẽ phá `§18.9` mà không ai nhận ra
// cho tới khi một NPC nhắc tới điều nó không thể biết.
message CognitionContext {
  string request_id = 1;
  mow.common.v1.EntityId entity = 2;
  mow.common.v1.WorldId world = 3;
  mow.common.v1.BranchId branch = 4;
  mow.common.v1.Tick now = 5;
  Trigger trigger = 6;

  repeated Observation observations = 7;
  repeated RetrievedMemory memories = 8;
  // Tên các action mà thực thể **biết làm**, đã rút gọn (`§10.4` bước 4).
  repeated string available_actions = 9;
  // Tóm tắt tính cách đã version hóa.
  string persona_summary = 10;
  string persona_version = 11;
  // Mục tiêu và cam kết đang hoạt động.
  repeated string active_goals = 12;
  // Nhu cầu hiện tại: tên → mức `0`–`1000`.
  map<string, uint32> needs = 13;
}

// Ý định mà model chọn (`§10.4` bước 5).
//
// Là **đề nghị**, không phải lệnh. `§10.4` bước 7 nói thẳng: "Assertion do model
// viết không bao giờ thay thế bước kiểm tra này."
message IntentProposal {
  // Tên action, phải nằm trong `available_actions`.
  string action = 1;
  optional mow.common.v1.EntityId target = 2;
  map<string, mow.common.v1.Value> params = 3;

  // **Bắt buộc khi ý định dựa trên một tiền đề thực tế.**
  //
  // Mỗi phần tử là `Observation.id` hoặc `RetrievedMemory.id` trong đúng
  // `CognitionContext` này. Validator từ chối reference chéo — đó là thứ giữ cho
  // `§20.6` batch được mà không rò ngữ cảnh giữa các thực thể.
  repeated string evidence_refs = 4;

  // Lý do, dạng văn bản, để hiển thị.
  //
  // **Không có hiệu lực authoritative.** `§10.4` bước 6 nói rõ: phần văn bản
  // không có reference không được trao hiệu lực. Nó vào UI và vào log, không
  // vào luật.
  string rationale = 5;
}

// Model trả về cái này.
message CognitionResponse {
  string request_id = 1;
  repeated IntentProposal intents = 2;
  // Model **thật sự** đã dùng, không phải model được định tuyến (`§20.10`).
  string model_used = 3;
  string prompt_id = 4;
  string prompt_version = 5;
}

// Vì sao một chu trình nhận thức không chạy được bằng model (`§20.10`).
//
// Mỗi giá trị ở đây là một event có thật trong log. Không có `FALLBACK_UNKNOWN`
// dùng làm chỗ đổ rác: một fallback không rõ lý do là một fallback không sửa
// được, và `§20.10` đòi audit trả lời được câu hỏi *vì sao*.
enum FallbackReason {
  FALLBACK_REASON_UNSPECIFIED = 0;
  FALLBACK_REASON_TIMEOUT = 1;
  FALLBACK_REASON_BREAKER_OPEN = 2;
  FALLBACK_REASON_BUDGET_EXHAUSTED = 3;
  FALLBACK_REASON_SCHEMA_INVALID = 4;
  FALLBACK_REASON_VALIDATION_FAILED = 5;
}

// Một lần hạ cấp hoặc rơi hẳn về policy (`§20.10`, `PC-09`).
message FallbackEvent {
  string request_id = 1;
  mow.common.v1.EntityId entity = 2;
  FallbackReason reason = 3;
  // Model được định tuyến tới.
  string routed_model = 4;
  // Model đã dùng thật. Rỗng nghĩa là rơi hẳn về policy, không gọi model nào.
  string actual_model = 5;
  // Hành động dự phòng đã chọn: `wait`, `defend`, `continue_routine`.
  string fallback_action = 6;
  mow.common.v1.Tick at_tick = 7;
}
