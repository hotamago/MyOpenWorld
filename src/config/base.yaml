# Lop nen. Luon duoc nap truoc moi lop khac.
# KHONG BAO GIO dat bi mat o day: file nay duoc commit.
# Bi mat nam o .env, tham chieu qua ten bien trong `*.api_key_env`.

env: dev

sim:
  tick_rate: 20
  chunk_size: 32
  active_radius: 3
  snapshot_interval: 10000

persistence:
  url: "saves/world.sqlite"

vector:
  # Phai khac persistence.url — P0-09.
  url: "memory-index/index.sqlite"
  # 1024 = so chieu goc cua jina-embeddings-v5-text-small (nen Qwen3-0.6B).
  # Model ho tro Matryoshka nen cat duoc ve 768/512/256...; muon vay thi doi so
  # nay va de `embedding.send_dimensions: true`. Day la NGUON DUY NHAT cua so
  # chieu — `embedding` khong khai lai no.
  dimension: 1024

llm:
  # STUB o moi truong mac dinh: khong mang, khong token, xac dinh.
  # Doi sang LIVE bang `MOW_ENV=live` (xem live.yaml) chu khong sua file nay.
  mode: STUB
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  # TEN bien moi truong, khong phai khoa. Khoa nam o `.env`.
  api_key_env: OPENROUTER_API_KEY
  model: "deepseek/deepseek-v4-flash-0731"
  max_output_tokens: 2048
  # Phan nghin. 0 = tham lam. Da dang cua the gioi den tu seed, khong tu bo lay
  # mau — da dang cua bo lay mau khong phat lai duoc.
  temperature_milli: 0
  # Ghi cong tren bang xep hang cua OpenRouter. Tuy chon.
  app_url: "https://github.com/hotamago/MyOpenWorld"
  app_title: "My Open World"
  # Do tre nhan thuc co dinh D, theo §20.2.2. Xem tai lieu cua truong nay.
  cognitive_latency_ticks: 10
  timeout_ms: 30000
  cassette_dir: "llm-cassettes"

  # Dinh tuyen model theo VAI — §20.7. Truong nao de trong hoac bang 0 thi ke
  # thua gia tri `llm.*` o tren.
  #
  # Vi sao tach ba vai chu khong dung mot model cho tat ca: ba vai khac nhau ve
  # SO LAN GOI toi vai bac do lon, khong khac nhau ve kien truc.
  #
  #   action  goi nhieu nhat — moi thuc the, moi lan quyet dinh buoc tiep theo.
  #           Nhung viec no lam la viec don gian: chon mot hanh dong trong mot
  #           danh sach ngan. Tra gia mot model manh cho no la tra gia manh nhat
  #           cho cong viec tam thuong nhat.
  #   npc     hoi thoai va chien thuat — thua so lan goi, can chat luong vua.
  #   yuu     hiem nhat: phan tu, ngoai giao phuc tap, de xuat law/species. Moi
  #           lan goi la mot quyet dinh anh huong ca the gioi, nen day la cho
  #           dang tra tien cho mot model manh.
  #
  # Gop lai mot model nghia la chon MOT trong hai cai gia: hoac tra gia `yuu`
  # cho moi buoc di cua moi NPC, hoac giao viec cua `yuu` cho mot model khong
  # kham noi. Ca hai deu khong phat hien duoc bang test — cai thu nhat lo ra
  # tren hoa don, cai thu hai lo ra o chat luong the gioi.
  routes:
    action:
      # May chu cuc bo rieng cho model hanh dong (khac cong 18080 cua embedding).
      # Chay cuc bo vi day la vai bi goi nhieu nhat: mot lan goi mien phi nhung
      # cham van re hon mot lan goi tinh tien.
      base_url: "http://localhost:18081/v1"
      # Endpoint khac thi khoa khac — khong dung chung khoa OpenRouter.
      api_key_env: LOCAL_LLM_API_KEY
      model: "Qwen/Qwen3.5-4B"
      # 256 la du cho "chon mot hanh dong". Nho hon nua thi model bi cat giua
      # chung va tra ve chuoi rong — xem tai lieu cua `llm.max_output_tokens`.
      max_output_tokens: 256
    npc:
      # Ke thua base_url/api_key_env cua OpenRouter o tren; chi doi model.
      model: "deepseek/deepseek-v4-flash-0731"
    yuu:
      model: "deepseek/deepseek-v4-pro-0813"
      # Rong hon han: phan tu va de xuat law can cho ra van ban dai, va mot lan
      # bi cat o day dat hon nhieu so voi so token da tra them.
      max_output_tokens: 4096

embedding:
  # STUB = bam dac trung chay tai cho: xac dinh, khong mang, khong khoa.
  # Cho tuong dong TU VUNG, khong phai ngu nghia — du de ca duong ong ky uc
  # chay va replay duoc truoc khi co bat ky khoa nao.
  mode: STUB
  provider: local
  # May chu cuc bo dung bang `./mow ai up` (vLLM phuc vu model duoi day).
  base_url: "http://localhost:18080/v1"
  api_key_env: EMBEDDINGS_API_KEY
  # Khop `--served-model-name` trong docker-compose.yml.
  model: "jina-embeddings-v5-text-small"
  batch_size: 32
  timeout_ms: 30000
  # TAT. Model goc ho tro Matryoshka, nhung ban `-retrieval` da gop adapter
  # thi khong: vLLM tra `400 does not support Matryoshka embeddings;
  # dimensions must be unset`. Khong sao — 1024 la so chieu goc, dung bang
  # `vector.dimension`, nen khong can cat gi ca.
  send_dimensions: false
  # De trong: ban `-retrieval` da gop adapter nen may chu tu ap tien to tac vu.
  # Dat gia tri neu ban doi sang mot model doi tien to tuong minh.
  query_prefix: ""
  document_prefix: ""

budget:
  max_calls_per_tick: 8
  max_concurrent: 4

content:
  root: "content"
  packs: ["core"]

observability:
  log_level: "info"
  log_format: pretty
  otel_endpoint: ""
