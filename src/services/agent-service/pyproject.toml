[project]
name = "agent-service"
version = "0.1.0"
description = "Lop nhan thuc: LangGraph, prompt registry, budget scheduler."
requires-python = ">=3.12"
dependencies = [
  "betterproto[compiler]==2.0.0b7",
  "grpcio-tools>=1.68",
  "jinja2>=3.1",
  "langgraph>=0.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]
