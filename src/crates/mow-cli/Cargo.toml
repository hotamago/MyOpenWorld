[package]
name = "mow-cli"
description = "Cong cu dong lenh: kich ban, determinism, phien go loi cho mow-mcp, kiem content pack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mow-cli"
path = "src/main.rs"

[dependencies]
mow-core = { workspace = true }
mow-math = { workspace = true }
mow-plugin = { workspace = true }
mow-scenario = { path = "../mow-scenario" }
mow-devtool = { path = "../mow-devtool" }
mow-config = { path = "../mow-config" }
mow-llm = { path = "../mow-llm" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
