[package]
name = "mow-llm"
description = "LLM Gateway: bon che do LIVE/RECORD/REPLAY/STUB, va thoi diem ap ket qua co dinh theo §20.2.2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `ureq` chu khong phai `reqwest`: `ModelClient` la trait dong bo, va keo
# `tokio` vao de phuc vu mot trait dong bo la keo ca runtime cho mot loi goi
# request-response. Cung lap luan voi `mow-vector::qdrant`.
ureq = "3"
mow-core = { workspace = true }
mow-math = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
