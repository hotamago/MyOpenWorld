[package]
name = "mow-server"
description = "Tien trinh giu the gioi va phuc vu giao dien: dia hinh tu worldgen, thuc the tu Sim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mow-server"
path = "src/main.rs"

[dependencies]
# `tiny_http` chu khong phai axum/hyper: dong bo, khong keo tokio vao mot du an
# co y tranh async (`§P10.3`). No lam dung mot viec — HTTP/1.1 blocking — va
# phan kho cua server nay khong nam o do.
tiny_http = "0.12"
mow-core = { workspace = true }
mow-math = { workspace = true }
mow-worldgen = { path = "../mow-worldgen" }
mow-scenario = { path = "../mow-scenario" }
serde_json = { workspace = true }
