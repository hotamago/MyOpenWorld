[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hotamago/MyOpenWorld"

[workspace.dependencies]
mow-math = { path = "crates/mow-math" }
mow-schema = { path = "crates/mow-schema" }
mow-core = { path = "crates/mow-core" }
mow-persist = { path = "crates/mow-persist" }
mow-plugin = { path = "crates/mow-plugin" }
mow-proto = { path = "crates/mow-proto" }
mow-action = { path = "crates/mow-action" }
mow-view = { path = "crates/mow-view" }
mow-law = { path = "crates/mow-law" }
mow-org = { path = "crates/mow-org" }
mow-econ = { path = "crates/mow-econ" }
mow-knowledge = { path = "crates/mow-knowledge" }
mow-culture = { path = "crates/mow-culture" }
mow-director = { path = "crates/mow-director" }
mow-war = { path = "crates/mow-war" }
mow-magic = { path = "crates/mow-magic" }
mow-society = { path = "crates/mow-society" }
mow-portal = { path = "crates/mow-portal" }
mow-eco = { path = "crates/mow-eco" }
mow-divine = { path = "crates/mow-divine" }
mow-yuu = { path = "crates/mow-yuu" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
rand = { version = "0.8", default-features = false }
rand_chacha = "0.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
schemars = { version = "0.8", features = ["indexmap2"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
prost = "0.13"
prost-build = { version = "0.13", default-features = false }
prost-types = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
