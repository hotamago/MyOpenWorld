[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hotamago/MyOpenWorld"

[workspace.dependencies]
mow-math = { path = "crates/mow-math" }
mow-schema = { path = "crates/mow-schema" }
mow-core = { path = "crates/mow-core" }
mow-persist = { path = "crates/mow-persist" }
mow-plugin = { path = "crates/mow-plugin" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
rand = { version = "0.8", default-features = false }
rand_chacha = "0.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
schemars = { version = "0.8", features = ["indexmap2"] }
proptest = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
