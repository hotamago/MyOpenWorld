name: Release

# Ban desktop la mot SMOKE BUILD (`PA-09`): no ton tai de bat som ba lop loi chi
# lo ra khi dong goi that — duong dan file, quyen he thong, va CSP cua WebView.
# Chay moi PR cham vao `web/` hoac `deploy/tauri/`, khong chay moi PR.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/web/**"
      - "src/deploy/tauri/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: Ban desktop build duoc tren ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: src/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0" }

      # Phu thuoc he thong cua WebKitGTK. Chi Linux can; hai he kia co WebView
      # san trong he dieu hanh.
      - name: phu thuoc he thong (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: dung frontend
        working-directory: src
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build

      # Buoc thuc su: neu dong goi hong o bat ky he nao, no do o day chu khong
      # do o Giai doan F khi kien truc da dong cung.
      - name: build ban desktop
        working-directory: src/deploy/tauri/src-tauri
        run: cargo build --locked

      - name: binary co ton tai
        shell: bash
        working-directory: src/deploy/tauri/src-tauri
        run: |
          set -eu
          f=$(ls target/debug/mow-desktop target/debug/mow-desktop.exe 2>/dev/null | head -1)
          test -n "$f"
          echo "OK: $f"

      # `§P10.5`: devtool khong bao gio vao ban phat hanh. Kiem tren chinh
      # binary, khong tren ma nguon — feature flag co the bi bat nham qua mot
      # phu thuoc bac cau, va luc do chi binary moi noi that.
      - name: khong co symbol devtool trong binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: src/deploy/tauri/src-tauri
        run: |
          if strings target/debug/mow-desktop | grep -q 'mow_devtool'; then
            echo "::error::devtool bi link vao ban desktop (§P10.5)"
            exit 1
          fi
          echo "OK: khong co symbol devtool"

  bundle:
    name: Dong goi that tren ${{ matrix.os }}
    # Chi chay khi phat hanh. `cargo tauri build` mat hang chuc phut va tao
    # installer that; chay no moi PR se lam vong lap phan hoi khong dung duoc.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: src/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0" }

      - name: phu thuoc he thong (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: dung frontend
        working-directory: src
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build

      # Sidecar Python (`§P3.4`). Phai co TRUOC khi bundle: `externalBin` o
      # `tauri.bundle.conf.json` doi dung file nay, va thieu no thi bundle hong
      # o buoc cuoi thay vi o buoc dau.
      - name: dong goi sidecar
        working-directory: src
        run: |
          uv tool install pyinstaller
          python deploy/tauri/scripts/build-sidecar.py

      - name: cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      # `--config tauri.bundle.conf.json` chong len config nen de them
      # `externalBin`. Tach nhu vay de `cargo build` — smoke build chay moi PR —
      # khong doi phai co sidecar.
      - name: bundle
        working-directory: src/deploy/tauri/src-tauri
        run: cargo tauri build --config tauri.bundle.conf.json

      - name: luu installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            src/deploy/tauri/src-tauri/target/release/bundle/**/*.msi
            src/deploy/tauri/src-tauri/target/release/bundle/**/*.dmg
            src/deploy/tauri/src-tauri/target/release/bundle/**/*.AppImage
            src/deploy/tauri/src-tauri/target/release/bundle/**/*.deb
          retention-days: 30

  desktop-e2e:
    name: tauri-driver — duong rieng cua desktop
    # `§P7.8`: duong rieng cua Tauri (duong dan file, quyen, sidecar) test bang
    # `tauri-driver`, khong bang Playwright thuong. Chi Linux: `tauri-driver`
    # dua tren WebKitWebDriver, va no on dinh nhat o day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: src/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0" }

      - name: phu thuoc he thong
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: dung frontend va app
        working-directory: src
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build
          cd deploy/tauri/src-tauri && cargo build --locked

      - name: chay e2e desktop
        working-directory: src
        env:
          TAURI_DRIVER: "1"
        run: xvfb-run -a pnpm --filter web test:e2e:desktop
